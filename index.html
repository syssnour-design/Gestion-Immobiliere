<style>
  :root{
    --paper:#F2EEDF; --paper-raised:#FBF9F1; --paper-sunken:#E9E3CE;
    --ink:#26312C; --ink-soft:#657064; --ink-faint:#8B9389;
    --brass:#8C6A22; --brass-strong:#6E5119; --brass-light:#E7DAB3; --brass-bg:#F1E9CE;
    --line:#D7CFAE;
    --green:#3E7053; --green-bg:#E1EBE1;
    --red:#AA4636; --red-bg:#F4E1DC;
    --amber:#B4842C; --amber-bg:#F3E7C9;
    --shadow-modal:0 12px 40px rgba(38,49,44,.28);
    --font-serif:'Lora',Georgia,'Times New Roman',serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark){
      --paper:#1B211C; --paper-raised:#232A24; --paper-sunken:#161B17;
      --ink:#EDE8D6; --ink-soft:#B7BDAE; --ink-faint:#818A7B;
      --brass:#D3AD5C; --brass-strong:#E8C878; --brass-light:#3A3324; --brass-bg:#2B2A1D;
      --line:#3A4038;
      --green:#7FBF9B; --green-bg:#1E2E24;
      --red:#E1897A; --red-bg:#332120;
      --amber:#E0B565; --amber-bg:#332A18;
      --shadow-modal:0 12px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1B211C; --paper-raised:#232A24; --paper-sunken:#161B17;
    --ink:#EDE8D6; --ink-soft:#B7BDAE; --ink-faint:#818A7B;
    --brass:#D3AD5C; --brass-strong:#E8C878; --brass-light:#3A3324; --brass-bg:#2B2A1D;
    --line:#3A4038;
    --green:#7FBF9B; --green-bg:#1E2E24;
    --red:#E1897A; --red-bg:#332120;
    --amber:#E0B565; --amber-bg:#332A18;
    --shadow-modal:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--font-sans);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}
  h1,h2,h3,h4{font-family:var(--font-serif);font-weight:600;margin:0;color:var(--ink);}
  a{color:var(--brass-strong);}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:var(--font-sans);cursor:pointer;}
  input,select,textarea{font-family:var(--font-sans);font-size:14px;}
  ::selection{background:var(--brass-light);}

  /* ---- header ---- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:22px 0 14px;border-bottom:2px solid var(--brass);margin-bottom:18px;}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .brand h1{font-size:26px;letter-spacing:.2px;}
  .brand .sub{color:var(--ink-soft);font-size:13px;margin-top:3px;}
  .brand .sub button{background:none;border:none;color:var(--brass-strong);text-decoration:underline;padding:0;font-size:13px;}
  .actions-top{display:flex;gap:10px;flex-wrap:wrap;}
  .tabs{display:flex;gap:22px;margin-top:16px;border-top:1px solid var(--line);padding-top:0;}
  .tab-btn{background:none;border:none;padding:10px 2px;font-size:14px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--brass);font-weight:600;}

  /* ---- buttons ---- */
  .btn{border:1px solid var(--ink);background:var(--paper-raised);color:var(--ink);padding:8px 14px;border-radius:3px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--brass-bg);border-color:var(--brass);}
  .btn-primary{background:var(--brass);border-color:var(--brass);color:var(--paper-raised);}
  .btn-primary:hover{background:var(--brass-strong);border-color:var(--brass-strong);}
  .btn-ghost{border-color:transparent;background:none;}
  .btn-ghost:hover{background:var(--paper-sunken);}
  .btn-danger{border-color:var(--red);color:var(--red);background:none;}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:5px 10px;font-size:12.5px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---- cards / sections ---- */
  .section{margin-bottom:34px;}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .section-head h2{font-size:19px;}
  .kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;}
  .kpi{flex:1 1 170px;background:var(--paper-raised);border:1px solid var(--line);border-top:3px solid var(--brass);padding:14px 16px;border-radius:2px;}
  .kpi .v{font-family:var(--font-serif);font-size:24px;font-weight:700;}
  .kpi .l{color:var(--ink-soft);font-size:12.5px;margin-top:4px;}
  .kpi.warn{border-top-color:var(--red);}
  .kpi .v.warn{color:var(--red);}

  .cour-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:3px;margin-bottom:16px;overflow:hidden;}
  .cour-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;gap:12px;flex-wrap:wrap;}
  .cour-head:hover{background:var(--paper-sunken);}
  .cour-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .chevron{display:inline-block;width:14px;color:var(--brass);font-size:12px;transition:transform .15s;}
  .cour-loc{color:var(--ink-soft);font-size:13px;}
  .cour-meta{display:flex;gap:16px;font-size:12.5px;color:var(--ink-soft);align-items:center;}
  .cour-body{padding:0 18px 18px;border-top:1px solid var(--line);}
  .cour-actions{display:flex;gap:8px;}

  .maison-card{background:var(--paper);border:1px solid var(--line);border-radius:3px;margin-top:12px;}
  .maison-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer;gap:10px;flex-wrap:wrap;}
  .maison-head:hover{background:var(--paper-sunken);}
  .maison-title{font-weight:600;}
  .maison-sub{color:var(--ink-soft);font-size:12.5px;}
  .maison-summary{display:flex;gap:18px;font-size:13px;align-items:center;flex-wrap:wrap;}
  .maison-body{padding:4px 14px 16px;border-top:1px solid var(--line);}

  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 16px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);border-radius:3px;padding:8px 9px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 2px var(--brass-light);}
  .field textarea{resize:vertical;min-height:52px;}

  .subblock{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);}
  .subblock-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .subblock-head h4{font-size:14px;color:var(--ink-soft);font-weight:600;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  .table-wrap{overflow-x:auto;}
  th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--brass);white-space:nowrap;}
  td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .empty-hint{color:var(--ink-faint);font-size:13px;padding:12px 4px;font-style:italic;}

  .form-box{background:var(--brass-bg);border:1px solid var(--brass-light);border-radius:3px;padding:14px;margin-top:12px;}
  .form-actions{display:flex;gap:8px;margin-top:12px;}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(20,24,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto;}
  .modal{background:var(--paper-raised);border-radius:4px;max-width:560px;width:100%;box-shadow:var(--shadow-modal);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
  .modal-body{padding:20px;}

  .receipt{background:#fff;color:#1c231e;border:1px solid #ccc;padding:28px;font-family:var(--font-sans);}
  .receipt h2{font-family:var(--font-serif);font-size:22px;letter-spacing:.3px;border-bottom:2px solid #8C6A22;padding-bottom:10px;margin-bottom:16px;color:#1c231e;}
  .receipt .rnum{color:#657064;font-size:12.5px;margin-top:-10px;margin-bottom:16px;}
  .receipt table{font-size:14px;}
  .receipt td{border:none;padding:5px 0;}
  .receipt td.rl{color:#657064;width:44%;}
  .receipt .amount-box{background:#F1E9CE;border:1px solid #D7CFAE;padding:10px 14px;margin:14px 0;border-radius:3px;}
  .receipt .amount-box .big{font-family:var(--font-serif);font-size:20px;font-weight:700;}
  .receipt .sigs{display:flex;justify-content:space-between;margin-top:44px;font-size:12.5px;color:#657064;}
  .receipt .sigs div{width:45%;border-top:1px solid #999;padding-top:6px;text-align:center;}

  footer.hint{color:var(--ink-faint);font-size:12px;text-align:center;margin-top:30px;}

  @media print{
    body.print-mode #app > *:not(.print-target){display:none !important;}
    body.print-mode{background:#fff;}
    .print-target{position:static !important;background:none !important;box-shadow:none !important;padding:0 !important;}
    .print-target .no-print{display:none !important;}
    .print-target .modal{box-shadow:none;max-width:100%;}
  }
  .save-flag{font-size:12px;color:var(--ink-faint);}
  .letter{background:#fff;color:#1c231e;border:1px solid #ccc;padding:26px;font-size:13.5px;line-height:1.55;}
  .letter .l-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid #8C6A22;padding-bottom:10px;margin-bottom:16px;}
  .letter .l-dest{margin:0 0 14px auto;width:min(300px,100%);}
  .letter .l-muted{color:#657064;font-size:12.5px;}
  .letter table{font-size:13px;margin:10px 0;}
  .letter th{color:#1c231e;background:#F1E9CE;}
  .letter td{border-bottom:1px solid #D7CFAE;}
  .letter p{margin:10px 0;}
</style>

<body>
<div id="app"></div>
<script id="state-data" type="application/json">{"proprietaires":[],"cours":[],"nextIds":{"proprietaire":1,"cour":1,"maison":1,"paiement":1,"depense":1,"locataire":1}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>/* ===================== GABARIT DE PAGE (pour republication) ===================== */
/* Capturé avant tout rendu : c'est le gabarit statique exact du document,
   avec le bloc #state-data encore à son contenu d'origine. */
var PAGE_TEMPLATE = '<!doctype html>\n' + document.documentElement.outerHTML;

/* ===================== ENVIRONNEMENT ===================== */
/* IN_CLAUDE : vrai lorsque la page tourne dans un artefact Claude (sauvegarde
   automatique côté serveur disponible). Faux en dehors (ex. GitHub Pages) :
   dans ce cas on utilise le stockage local du navigateur. */
var IN_CLAUDE = (typeof window.claude !== 'undefined');
var LOCAL_KEY = 'registre-immobilier-state-v1';

/* ===================== ÉTAT ===================== */
var state;
(function initState() {
  var embedded = JSON.parse(document.getElementById('state-data').textContent);
  if (!IN_CLAUDE) {
    try {
      var local = localStorage.getItem(LOCAL_KEY);
      if (local) { state = JSON.parse(local); return; }
    } catch (e) {}
  }
  state = embedded;
})();
if (!state.cours) state.cours = [];
if (!state.nextIds) state.nextIds = {};
['proprietaire', 'cour', 'maison', 'paiement', 'depense', 'locataire'].forEach(function (k) {
  if (!state.nextIds[k]) state.nextIds[k] = 1;
});
if (state.nextIds.reparation && state.nextIds.reparation > state.nextIds.depense) {
  state.nextIds.depense = state.nextIds.reparation;
}
delete state.nextIds.reparation;
/* Migration : ancien modèle à propriétaire unique -> tableau de propriétaires */
if (!state.proprietaires) {
  var legacyNom = (state.proprietaire && state.proprietaire.nom) || 'Propriétaire principal';
  var legacyTel = (state.proprietaire && state.proprietaire.telephone) || '';
  var legacyId = uid('proprietaire');
  state.proprietaires = [{ id: legacyId, nom: legacyNom, telephone: legacyTel }];
  state.cours.forEach(function (c) { if (!c.proprietaireId) c.proprietaireId = legacyId; });
}
delete state.proprietaire;
if (!state.parametres) state.parametres = { jourEcheance: 10, compterNonEnregistres: true, ton: 'auto', lieu: 'Abidjan' };
state.cours.forEach(function (c) {
  if (!c.proprietaireId && state.proprietaires.length) c.proprietaireId = state.proprietaires[0].id;
  if (!c.depensesGenerales) {
    c.depensesGenerales = (c.reparationsGenerales || []).map(function (r) {
      var o = {}; for (var k in r) o[k] = r[k];
      if (!o.type) o.type = 'Réparation';
      return o;
    });
  }
  delete c.reparationsGenerales;
  (c.maisons || []).forEach(function (m) {
    if (!m.locataireId) m.locataireId = uid('locataire');
    if (!m.relances) m.relances = [];
    if (!m.depenses) {
      m.depenses = (m.reparations || []).map(function (r) {
        var o = {}; for (var k in r) o[k] = r[k];
        if (!o.type) o.type = 'Réparation';
        return o;
      });
    }
    delete m.reparations;
  });
});

var _now = new Date();
var ui = { tab: 'dashboard', openCours: {}, openMaisons: {}, addingCour: false,
  addingMaisonTo: null, editingCour: null, editingMaison: null, duplicatePrefill: null,
  addingPaiementTo: null, addingDepenseTo: null, printing: null, savedFlag: '',
  filterProprietaire: 'all', relanceSel: {}, relancePreview: null, etat: null, addingProprietaire: false, editingProprietaire: null,
  periodType: 'mois', periodYear: _now.getFullYear(), periodMonth: _now.getMonth() + 1,
  periodQuarter: Math.ceil((_now.getMonth() + 1) / 3), periodSemester: (_now.getMonth() + 1) <= 6 ? 1 : 2 };
try {
  var saved = sessionStorage.getItem('immo-ui');
  if (saved) ui = Object.assign(ui, JSON.parse(saved));
} catch (e) {}

var claudeArtifact = null;
var claudeDownloads = null;
(async function initCapabilities() {
  try {
    if (IN_CLAUDE && window.claude.use) {
      claudeArtifact = await window.claude.use('artifact');
      claudeDownloads = await window.claude.use('downloads');
    }
  } catch (e) {}
})();

/* ===================== UTILITAIRES ===================== */
function uid(kind) {
  var n = state.nextIds[kind] || 1;
  state.nextIds[kind] = n + 1;
  var prefix = { proprietaire: 'PR', cour: 'CR', maison: 'M', paiement: 'PM', depense: 'DP', locataire: 'LOC' }[kind];
  return prefix + '-' + String(n).padStart(3, '0');
}
function fmtMoney(n) {
  n = Number(n) || 0;
  return n.toLocaleString('fr-FR').replace(/\u202f|\u00a0/g, ' ') + ' FCFA';
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function val(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}
function numVal(id) {
  var v = val(id).replace(/\s/g, '').replace(',', '.');
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function findCour(id) { return state.cours.find(function (c) { return c.id === id; }); }
function findProprietaire(id) { return state.proprietaires.find(function (p) { return p.id === id; }); }
function scopedCours() {
  if (ui.filterProprietaire === 'all') return state.cours;
  return state.cours.filter(function (c) { return c.proprietaireId === ui.filterProprietaire; });
}
function findMaison(id) {
  for (var i = 0; i < state.cours.length; i++) {
    var m = state.cours[i].maisons.find(function (m) { return m.id === id; });
    if (m) return { cour: state.cours[i], maison: m };
  }
  return null;
}
function findMaisonByLocataireId(locId) {
  locId = String(locId || '').trim().toLowerCase();
  if (!locId) return null;
  for (var i = 0; i < state.cours.length; i++) {
    var m = state.cours[i].maisons.find(function (m) { return String(m.locataireId || '').trim().toLowerCase() === locId; });
    if (m) return { cour: state.cours[i], maison: m };
  }
  return null;
}
function monthLabel(periode) {
  if (!periode) return '';
  var parts = periode.split('-');
  if (parts.length !== 2) return periode;
  var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var idx = parseInt(parts[1], 10) - 1;
  return (mois[idx] || parts[1]) + ' ' + parts[0];
}
function currentPeriode() {
  var d = new Date();
  return todayISO().slice(0, 7);
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

function numberToFrenchWords(n) {
  n = Math.round(Number(n) || 0);
  if (n === 0) return 'zéro';
  var units = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf', 'dix',
    'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize', 'dix-sept', 'dix-huit', 'dix-neuf'];
  var tens = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante', 'soixante', 'quatre-vingt', 'quatre-vingt'];
  function two(num, fin) {
    if (num < 20) return units[num];
    var t = Math.floor(num / 10), u = num % 10;
    if (t === 7 || t === 9) {
      var base = t === 7 ? 'soixante' : 'quatre-vingt';
      return base + (u === 1 && t === 7 ? ' et onze' : '-' + units[10 + u]);
    }
    if (u === 0) return tens[t] + (t === 8 && fin ? 's' : '');
    if (u === 1 && t !== 8) return tens[t] + ' et un';
    return tens[t] + '-' + units[u];
  }
  function three(num, fin) {
    var h = Math.floor(num / 100), r = num % 100, str = '';
    if (h > 0) {
      str += (h === 1 ? 'cent' : units[h] + ' cent');
      if (h > 1 && r === 0 && fin) str += 's';
    }
    if (r > 0) str += (str ? ' ' : '') + two(r, fin);
    return str;
  }
  var parts = [];
  var millions = Math.floor(n / 1000000);
  var milliers = Math.floor((n % 1000000) / 1000);
  var reste = n % 1000;
  if (millions > 0) parts.push(millions === 1 ? 'un million' : three(millions, true) + ' millions');
  if (milliers > 0) parts.push(milliers === 1 ? 'mille' : three(milliers, false) + ' mille');
  if (reste > 0) parts.push(three(reste, true));
  var out = parts.join(' ');
  return out.charAt(0).toUpperCase() + out.slice(1);
}

/* ===================== PERSISTENCE ===================== */
function persistUi() {
  try { sessionStorage.setItem('immo-ui', JSON.stringify(ui)); } catch (e) {}
}
function buildPublishHtml() {
  var newJson = JSON.stringify(state).replace(/</g, '\\u003c');
  return PAGE_TEMPLATE.replace(
    /(<script id="state-data" type="application\/json">)[\s\S]*?(<\/script>)/,
    function (m, p1, p2) { return p1 + newJson + p2; }
  );
}
async function save() {
  persistUi();
  render();
  if (IN_CLAUDE) {
    if (claudeArtifact) {
      try {
        await claudeArtifact.publish(buildPublishHtml());
      } catch (e) {
        if (e && e.code === 'conflict') { /* la vue va se recharger */ }
        else {
          ui.savedFlag = 'Sauvegarde impossible (' + (e && e.code ? e.code : 'erreur') + ') — modifications conservées ici seulement.';
          render();
        }
      }
    } else {
      ui.savedFlag = 'Mode aperçu : les modifications ne sont pas sauvegardées.';
      render();
    }
  } else {
    try {
      localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
    } catch (e) {
      ui.savedFlag = 'Sauvegarde locale impossible dans ce navigateur — modifications non conservées après fermeture.';
      render();
    }
  }
}

/* ===================== PROPRIÉTAIRES ===================== */
function showAddProprietaire() { ui.addingProprietaire = true; render(); }
function cancelAddProprietaire() { ui.addingProprietaire = false; render(); }
function submitAddProprietaire() {
  var nom = val('f-prop-nom');
  if (!nom) { alert('Le nom du propriétaire est obligatoire.'); return; }
  var p = { id: uid('proprietaire'), nom: nom, telephone: val('f-prop-tel') };
  state.proprietaires.push(p);
  ui.addingProprietaire = false;
  save();
}
function showEditProprietaire(id) { ui.editingProprietaire = id; render(); }
function cancelEditProprietaire() { ui.editingProprietaire = null; render(); }
function submitEditProprietaire(id) {
  var p = findProprietaire(id);
  if (!p) return;
  var nom = val('f-eprop-nom-' + id);
  if (!nom) { alert('Le nom du propriétaire est obligatoire.'); return; }
  p.nom = nom; p.telephone = val('f-eprop-tel-' + id);
  ui.editingProprietaire = null;
  save();
}
function deleteProprietaire(id) {
  var p = findProprietaire(id);
  if (!p) return;
  var cours = state.cours.filter(function (c) { return c.proprietaireId === id; });
  var nbMaisons = cours.reduce(function (s, c) { return s + c.maisons.length; }, 0);
  var msg = 'Supprimer le propriétaire « ' + p.nom + ' »';
  if (cours.length) msg += ', ainsi que ses ' + cours.length + ' cour(s) et ' + nbMaisons + ' maison(s) avec tout leur historique';
  msg += ' ? Cette action est irréversible.';
  if (!confirm(msg)) return;
  state.cours = state.cours.filter(function (c) { return c.proprietaireId !== id; });
  state.proprietaires = state.proprietaires.filter(function (x) { return x.id !== id; });
  if (ui.filterProprietaire === id) ui.filterProprietaire = 'all';
  save();
}
function setFilterProprietaire(v) { ui.filterProprietaire = v; persistUi(); render(); }

/* ===================== FILTRES DE PÉRIODE (tableau de bord) ===================== */
function setPeriodType(v) { ui.periodType = v; persistUi(); render(); }
function setPeriodYear(v) { ui.periodYear = parseInt(v, 10); persistUi(); render(); }
function setPeriodMonth(v) { ui.periodMonth = parseInt(v, 10); persistUi(); render(); }
function setPeriodQuarter(v) { ui.periodQuarter = parseInt(v, 10); persistUi(); render(); }
function setPeriodSemester(v) { ui.periodSemester = parseInt(v, 10); persistUi(); render(); }
function periodRange() {
  var y = ui.periodYear, startM, endM;
  if (ui.periodType === 'mois') { startM = endM = ui.periodMonth; }
  else if (ui.periodType === 'trimestre') { startM = (ui.periodQuarter - 1) * 3 + 1; endM = startM + 2; }
  else if (ui.periodType === 'semestre') { startM = ui.periodSemester === 1 ? 1 : 7; endM = ui.periodSemester === 1 ? 6 : 12; }
  else { startM = 1; endM = 12; }
  return { start: y + '-' + String(startM).padStart(2, '0'), end: y + '-' + String(endM).padStart(2, '0') };
}
function periodLabel() {
  var r = periodRange();
  if (ui.periodType === 'mois') return monthLabel(r.start);
  if (ui.periodType === 'annee') return 'Année ' + ui.periodYear;
  if (ui.periodType === 'trimestre') return 'T' + ui.periodQuarter + ' ' + ui.periodYear + ' (' + monthLabel(r.start) + ' – ' + monthLabel(r.end) + ')';
  return 'S' + ui.periodSemester + ' ' + ui.periodYear + ' (' + monthLabel(r.start) + ' – ' + monthLabel(r.end) + ')';
}


function toggleCour(id) { ui.openCours[id] = !ui.openCours[id]; persistUi(); render(); }
function toggleMaison(id) { ui.openMaisons[id] = !ui.openMaisons[id]; persistUi(); render(); }
function showAddCour() {
  if (!state.proprietaires.length) { alert('Créez d\'abord un propriétaire dans l\'onglet « Propriétaires ».'); return; }
  ui.addingCour = true; render();
}
function cancelAddCour() { ui.addingCour = false; render(); }
function submitAddCour() {
  var nom = val('f-cour-nom');
  if (!nom) { alert('Le nom de la cour est obligatoire.'); return; }
  var proprietaireId = val('f-cour-proprietaire');
  if (!proprietaireId) { alert('Sélectionnez un propriétaire.'); return; }
  var c = { id: uid('cour'), proprietaireId: proprietaireId, nom: nom, localisation: val('f-cour-loc'), description: val('f-cour-desc'),
    maisons: [], depensesGenerales: [] };
  state.cours.push(c);
  ui.addingCour = false;
  ui.openCours[c.id] = true;
  save();
}
function showEditCour(id) { ui.editingCour = id; render(); }
function cancelEditCour() { ui.editingCour = null; render(); }
function submitEditCour(id) {
  var c = findCour(id);
  if (!c) return;
  var nom = val('f-ecour-nom-' + id);
  if (!nom) { alert('Le nom de la cour est obligatoire.'); return; }
  var propId = val('f-ecour-proprietaire-' + id);
  c.nom = nom; c.localisation = val('f-ecour-loc-' + id); c.description = val('f-ecour-desc-' + id);
  if (propId) c.proprietaireId = propId;
  ui.editingCour = null;

function doPrint() {
  if (!ui.printing) return;
  var found = findMaison(ui.printing.maisonId);
  if (!found) return;
  var p = found.maison.paiements.find(function (x) { return x.id === ui.printing.payId; });
  if (!p) return;
  var montantMots = numberToFrenchWords(p.montantPaye) + ' francs CFA';
  var html = buildReceiptStandaloneHtml(found.cour, found.maison, p, montantMots);
  var w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (w && !w.closed) {
    try {
      w.document.open();
      w.document.write(html);
      w.document.close();
      return;
    } catch (e) { /* on retente le repli ci-dessous */ }
  }
  // Repli : la nouvelle fenêtre a été bloquée — on imprime la page actuelle.
  document.body.classList.add('print-mode');
  try { window.print(); } catch (e) {}
  alert("La fenêtre d'impression a été bloquée par le navigateur. Autorisez les pop-ups pour ce site, ou utilisez le raccourci Ctrl+P (Cmd+P sur Mac) pour imprimer la quittance affichée.");
}

/* ===================== CALCULS ===================== */
function computeTotals() {
  var range = periodRange();
  var cours = scopedCours();
  var t = { nbCours: cours.length, nbMaisons: 0, du: 0, paye: 0, impaye: 0, depenses: 0, depensesParType: {}, periodLabel: periodLabel() };
  function addDepense(r) {
    if (!(r.date >= range.start + '-01' && r.date <= range.end + '-31')) return;
    var montant = Number(r.montant) || 0;
    t.depenses += montant;
    var type = r.type || 'Autre';
    t.depensesParType[type] = (t.depensesParType[type] || 0) + montant;
  }
  cours.forEach(function (c) {
    (c.depensesGenerales || []).forEach(addDepense);
    c.maisons.forEach(function (m) {
      t.nbMaisons++;
      (m.depenses || []).forEach(addDepense);
      (m.paiements || []).forEach(function (p) {
        if (p.periode >= range.start && p.periode <= range.end) {
          t.du += Number(p.montantDu) || 0;
          t.paye += Number(p.montantPaye) || 0;
        }
      });
    });
  });
  t.impaye = Math.max(0, t.du - t.paye);
  return t;
}

/* ===================== RELANCES : PARAMÈTRES & DATES ===================== */
function paramEcheanceJour() {
  var j = parseInt(state.parametres && state.parametres.jourEcheance, 10);
  return (j >= 1 && j <= 28) ? j : 10;
}
function pad2(n) { return String(n).padStart(2, '0'); }
function dueDateISO(periode) { return periode + '-' + pad2(paramEcheanceJour()); }
function daysBetween(fromISO, toISO) {
  var a = Date.UTC(+fromISO.slice(0, 4), +fromISO.slice(5, 7) - 1, +fromISO.slice(8, 10));
  var b = Date.UTC(+toISO.slice(0, 4), +toISO.slice(5, 7) - 1, +toISO.slice(8, 10));
  return Math.round((b - a) / 86400000);
}
function addDaysISO(iso, n) {
  var d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) + n * 86400000);
  return d.toISOString().slice(0, 10);
}
function listPeriodes(startP, endP) {
  var out = [], y = +startP.slice(0, 4), mo = +startP.slice(5, 7);
  var ey = +endP.slice(0, 4), em = +endP.slice(5, 7);
  while (y < ey || (y === ey && mo <= em)) {
    out.push(y + '-' + pad2(mo));
    mo++; if (mo > 12) { mo = 1; y++; }
    if (out.length > 600) break;
  }
  return out;
}
function fmtNum(n) {
  n = Math.round(Number(n) || 0);
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}
var MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function fmtDateFR(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
function fmtDateLong(iso) {
  var d = parseInt(iso.slice(8, 10), 10);
  return (d === 1 ? '1er' : String(d)) + ' ' + MOIS_FR[parseInt(iso.slice(5, 7), 10) - 1] + ' ' + iso.slice(0, 4);
}
function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function slugify(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'locataire';
}

/* ===================== RELANCES : CALCUL DES MOIS IMPAYÉS ===================== */
/* Un loyer est dû au plus tard le jour d'échéance (10 par défaut) du mois concerné.
   Il est en retard dès le lendemain. Un mois sans aucun paiement enregistré est
   considéré impayé (option activée par défaut) tant que la maison est occupée. */
function computeUnpaidMonths(m, today, opts) {
  today = today || todayISO();
  opts = opts || {};
  var loyer = Number(m.loyer) || 0;
  var pays = m.paiements || [];
  var byP = {};
  pays.forEach(function (p) {
    if (!p.periode) return;
    var o = byP[p.periode] || (byP[p.periode] = { du: 0, paye: 0 });
    o.du += Number(p.montantDu) || 0;
    if (!(opts.paidUntil && p.datePaiement && p.datePaiement > opts.paidUntil)) o.paye += Number(p.montantPaye) || 0;
  });
  var starts = Object.keys(byP);
  if (m.dateEntree) starts.push(m.dateEntree.slice(0, 7));
  if (!starts.length) return [];
  starts.sort();
  var curP = today.slice(0, 7);
  var countUnrecorded = !state.parametres || state.parametres.compterNonEnregistres !== false;
  var occupied = !!(m.locataireNom && String(m.locataireNom).trim());
  var out = [];
  listPeriodes(starts[0], curP).forEach(function (periode) {
    var ech = dueDateISO(periode);
    if (opts.inclusive ? !(ech <= today) : !(ech < today)) return;
    if (opts.fromEch && ech < opts.fromEch) return;
    var rec = byP[periode];
    var du, paye, enregistre;
    if (rec) {
      du = rec.du > 0 ? rec.du : loyer; paye = rec.paye; enregistre = true;
    } else {
      if (!countUnrecorded || !occupied || loyer <= 0) return;
      if (m.dateEntree && periode === m.dateEntree.slice(0, 7) && parseInt(m.dateEntree.slice(8, 10), 10) > paramEcheanceJour()) return;
      du = loyer; paye = 0; enregistre = false;
    }
    var reste = du - paye;
    if (reste <= 0 && !opts.all) return;
    out.push({ periode: periode, echeance: ech, du: du, paye: paye, reste: reste, jours: daysBetween(ech, today), enregistre: enregistre });
  });
  return out;
}
function relanceNiveau(mois) {
  var t = state.parametres && state.parametres.ton;
  if (t === '1' || t === '2' || t === '3') return parseInt(t, 10);
  var maxJ = mois.reduce(function (s, x) { return Math.max(s, x.jours); }, 0);
  if (mois.length >= 3 || maxJ >= 60) return 3;
  if (mois.length >= 2 || maxJ >= 30) return 2;
  return 1;
}
function computeRelances() {
  var out = [];
  scopedCours().forEach(function (c) {
    var owner = findProprietaire(c.proprietaireId) || { nom: '', telephone: '' };
    c.maisons.forEach(function (m) {
      var mois = computeUnpaidMonths(m);
      if (!mois.length) return;
      var total = mois.reduce(function (s, x) { return s + x.reste; }, 0);
      var maxJ = mois.reduce(function (s, x) { return Math.max(s, x.jours); }, 0);
      var last = (m.relances || []).length ? m.relances[m.relances.length - 1] : null;
      out.push({ cour: c, maison: m, owner: owner, mois: mois, total: total, maxJours: maxJ, niveau: relanceNiveau(mois), derniere: last });
    });
  });
  out.sort(function (a, b) { return b.total - a.total; });
  return out;
}
/* Retards affichés dans la vue d'ensemble (une ligne par mois impayé) */
function computeArrears() {
  var rows = [];
  computeRelances().forEach(function (r) {
    r.mois.forEach(function (x) {
      rows.push({ cour: r.cour, maison: r.maison, solde: x.reste, jours: x.jours, enregistre: x.enregistre,

/* ===================== RELANCES : GÉNÉRATION PDF ===================== */
function pdfSafe(s) {
  return String(s == null ? '' : s)
    .replace(/[   ]/g, ' ').replace(/[’‘]/g, '\'')
    .replace(/[–—]/g, '-').replace(/…/g, '...').replace(/[“”]/g, '"');
}
function drawRelanceLetter(doc, L) {
  var ML = 20, W = 170, PB = 277, y = 22;
  doc.setLineHeightFactor(1.4);
  function ensure(h) { if (y + h > PB) { doc.addPage(); y = 22; } }
  function para(text, opts) {
    opts = opts || {};

    var lines = doc.splitTextToSize(pdfSafe(text), opts.w || W);
    var lh = (opts.size || 10.5) * 0.3528 * 1.4;
    ensure(lines.length * lh);
    doc.text(lines, opts.x || ML, y, { baseline: 'top' });
    y += lines.length * lh + (opts.gap == null ? 3 : opts.gap);
  }
  doc.setTextColor(38, 49, 44);
  // Expéditeur (haut gauche)
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5);
  doc.text(pdfSafe(L.expediteur || 'Le bailleur'), ML, y, { baseline: 'top' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(101, 112, 100);
  doc.text('Bailleur' + (L.expTel ? '  -  Tél : ' + pdfSafe(L.expTel) : ''), ML, y + 6, { baseline: 'top' });
  // Lieu et date (haut droite)
  doc.setTextColor(38, 49, 44); doc.setFontSize(10.5);
  doc.text(pdfSafe(L.lieuDate), ML + W, y, { align: 'right', baseline: 'top' });
  y += 15;
  doc.setDrawColor(140, 106, 34); doc.setLineWidth(0.6); doc.line(ML, y, ML + W, y);
  y += 10;
  // Destinataire
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
  var dy = y;
  L.destinataire.forEach(function (ln, i) {
    doc.setFont('helvetica', i === 0 ? 'bold' : 'normal');
    var parts = doc.splitTextToSize(pdfSafe(ln), 78);
    doc.text(parts, 112, dy, { baseline: 'top' });
    dy += parts.length * 5.2;
  });
  y = Math.max(y + 4, dy) + 8;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(101, 112, 100);
  doc.text('Réf. : ' + pdfSafe(L.ref), ML, y, { baseline: 'top' });
  y += 8;
  doc.setTextColor(38, 49, 44);
  // Objet
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5);
  var oLines = doc.splitTextToSize('Objet : ' + pdfSafe(L.objet), W);
  doc.text(oLines, ML, y, { baseline: 'top' });
  y += oLines.length * 5.2 + 7;
  para('Madame, Monsieur,', { gap: 4 });
  para(L.intro, { gap: 5 });
  // Tableau
  var cols = [['Mois', 36, 'left'], ['Échéance', 26, 'left'], ['Loyer dû', 28, 'right'], ['Déjà payé', 28, 'right'], ['Reste dû', 32, 'right'], ['Retard', 20, 'right']];
  function colX(i) { var x = ML; for (var k = 0; k < i; k++) x += cols[k][1]; return x; }
  function tableHeader() {
    ensure(16);
    doc.setFillColor(241, 233, 206); doc.rect(ML, y, W, 7.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    cols.forEach(function (c, i) {
      var x = c[2] === 'right' ? colX(i) + c[1] - 2 : colX(i) + 2;
      doc.text(pdfSafe(c[0]), x, y + 2, { align: c[2], baseline: 'top' });
    });
    y += 7.5;
  }
  doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(101, 112, 100);
  ensure(24);
  doc.text('Montants en FCFA', ML + W, y, { align: 'right', baseline: 'top' });
  y += 5; doc.setTextColor(38, 49, 44);
  tableHeader();
  L.lignes.forEach(function (ln) {
    if (y + 7 > PB) { doc.addPage(); y = 22; tableHeader(); }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    var vals = [ln.mois, ln.echeance, fmtNum(ln.du), fmtNum(ln.paye), fmtNum(ln.reste), ln.jours + ' j'];
    cols.forEach(function (c, i) {
      var x = c[2] === 'right' ? colX(i) + c[1] - 2 : colX(i) + 2;
      doc.text(pdfSafe(vals[i]), x, y + 1.8, { align: c[2], baseline: 'top' });
    });
    y += 7;
    doc.setDrawColor(215, 207, 174); doc.setLineWidth(0.2); doc.line(ML, y, ML + W, y);
  });
  ensure(10);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10);
  doc.setDrawColor(140, 106, 34); doc.setLineWidth(0.5); doc.line(ML, y, ML + W, y);
  doc.text('TOTAL À RÉGLER', colX(0) + 2, y + 2.2, { baseline: 'top' });

  para(L.note, { gap: 4 });

  para(L.formule, { gap: 8 });
  para('Le bailleur,', { gap: 14 });
  para(L.signataire, { bold: true });
}
function buildRelancesPdf(list) {
  if (!window.jspdf || !window.jspdf.jsPDF) return null;
  var doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  list.forEach(function (r, i) {
    if (i > 0) doc.addPage();
    drawRelanceLetter(doc, buildRelanceContent(r));

}

/* ===================== RELANCES : ENREGISTREMENT DU FICHIER ===================== */
/* Retourne true si le fichier a été remis à l'utilisateur. Aucun repli ni nouvel essai si
   l'utilisateur refuse l'enregistrement ou si la limite est atteinte. */
async function saveBlob(filename, blob) {
  if (claudeDownloads) {
    try {
      await claudeDownloads.save({ filename: filename, data: blob });
      return true;
    } catch (e) {
      if (e && (e.code === 'declined' || e.code === 'rate_limited')) return false;
    }
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  return true;
}
async function emitRelances(list, filename) {
  if (!list.length) { alert('Aucune relance à générer.'); return; }
  var doc = buildRelancesPdf(list);
  if (!doc) { alert('Le générateur PDF n\'a pas pu se charger. Vérifiez la connexion internet puis réessayez.'); return; }
  var ok = await saveBlob(filename, doc.output('blob'));
  if (ok) logRelances(list);
}
function logRelances(list) {
  var today = todayISO();
  list.forEach(function (r) {
    if (!r.maison.relances) r.maison.relances = [];
    var lst = r.maison.relances[r.maison.relances.length - 1];
    if (lst && lst.date === today && lst.total === r.total && lst.niveau === r.niveau) return;
    r.maison.relances.push({ date: today, niveau: r.niveau, total: r.total,
      periodes: r.mois.map(function (x) { return x.periode; }) });
  });
  save();
}
function relanceByMaison(id) {
  return computeRelances().find(function (r) { return r.maison.id === id; });
}
function downloadRelance(maisonId) {
  var r = relanceByMaison(maisonId);
  if (!r) { alert('Aucun loyer en retard pour cette maison.'); return; }
  emitRelances([r], 'Relance_' + slugify(r.maison.locataireNom || r.maison.locataireId) + '_' + todayISO() + '.pdf');
}
function downloadRelancesSelection() {
  var list = computeRelances().filter(function (r) { return ui.relanceSel[r.maison.id] !== false; });

/* ===================== ÉTATS PÉRIODIQUES (du A au B) ===================== */
var ETAT_TYPES = [
  ['dashboard', 'Tableau de bord de la période'],
  ['balance', 'Balance recettes / dépenses'],
  ['encaisses', 'Loyers encaissés (détail)'],
  ['retards', 'Mensualités en retard'],
  ['depenses', 'Dépenses (détail)']
];
function etatCfg() {
  if (!ui.etat) {
    var t = todayISO();
    ui.etat = { type: 'dashboard', from: t.slice(0, 7) + '-01', to: t };
  }
  return ui.etat;
}
function etatTitre(type) {
  var f = ETAT_TYPES.filter(function (x) { return x[0] === type; })[0];
  return f ? f[1] : 'État';
}
function setEtat(key, v) {
  var c = etatCfg(); c[key] = v;
  if (c.from && c.to && c.from > c.to) { if (key === 'from') c.to = c.from; else c.from = c.to; }
  persistUi(); render();
}
function setEtatPreset(p) {
  var c = etatCfg(), t = todayISO(), y = +t.slice(0, 4), mo = +t.slice(5, 7);
  var ms = t.slice(0, 7) + '-01';
  if (p === 'mois') { c.from = ms; c.to = t; }
  else if (p === 'moisprec') { c.to = addDaysISO(ms, -1); c.from = c.to.slice(0, 7) + '-01'; }
  else if (p === 'trimestre') { var q = Math.floor((mo - 1) / 3) * 3 + 1; c.from = y + '-' + pad2(q) + '-01'; c.to = t; }
  else if (p === 'annee') { c.from = y + '-01-01'; c.to = t; }
  else if (p === 'anneeprec') { c.from = (y - 1) + '-01-01'; c.to = (y - 1) + '-12-31'; }
  persistUi(); render();
}

/* Calcule un état : retourne { titre, sousTitre, orientation, kpis, sections } */
function computeEtat(type, from, to) {
  var cours = scopedCours();
  var asOf = to < todayISO() ? to : todayISO();
  var ownerSel = ui.filterProprietaire === 'all' ? 'Tous les propriétaires' : ((findProprietaire(ui.filterProprietaire) || {}).nom || '');
  function inR(d) { return d && d >= from && d <= to; }
  function sumBy(arr, f) { return arr.reduce(function (s, x) { return s + (f(x) || 0); }, 0); }

  var encaisses = [], retards = [], deps = [], perCour = [];
  cours.forEach(function (c) {
    var owner = (findProprietaire(c.proprietaireId) || {}).nom || '';
    var pc = { cour: c, owner: owner, nbM: c.maisons.length, att: 0, enc: 0, imp: 0, dep: 0 };
    (c.depensesGenerales || []).forEach(function (r) {
      if (inR(r.date)) { var d = { cour: c.nom, maison: 'Générale', r: r, montant: Number(r.montant) || 0 }; deps.push(d); pc.dep += d.montant; }
    });
    c.maisons.forEach(function (m) {
      (m.depenses || []).forEach(function (r) {
        if (inR(r.date)) { var d = { cour: c.nom, maison: m.nom, r: r, montant: Number(r.montant) || 0 }; deps.push(d); pc.dep += d.montant; }
      });
      (m.paiements || []).forEach(function (p) {
        var pay = Number(p.montantPaye) || 0;
        var dt = p.datePaiement || (p.periode ? p.periode + '-01' : '');
        if (pay > 0 && inR(dt)) { encaisses.push({ cour: c.nom, maison: m.nom, loc: m.locataireNom || '', p: p, date: dt, montant: pay }); pc.enc += pay; }
      });
      computeUnpaidMonths(m, to, { inclusive: true, fromEch: from, all: true, paidUntil: to }).forEach(function (x) { pc.att += x.du; });
      computeUnpaidMonths(m, asOf, { fromEch: from, paidUntil: to }).forEach(function (x) {
        pc.imp += x.reste;
        retards.push({ cour: c.nom, maison: m.nom, loc: m.locataireNom || '(' + (m.locataireId || '') + ')', x: x });
      });
    });
    perCour.push(pc);
  });
  var totEnc = sumBy(encaisses, function (e) { return e.montant; });
  var totDep = sumBy(deps, function (d) { return d.montant; });
  var totAtt = sumBy(perCour, function (p) { return p.att; });
  var totImp = sumBy(retards, function (r) { return r.x.reste; });
  var etat = {
    type: type, titre: etatTitre(type), orientation: 'portrait',
    sousTitre: 'Période du ' + fmtDateFR(from) + ' au ' + fmtDateFR(to) + ' - ' + ownerSel,
    kpis: [], sections: [], notes: []
  };
  var M = 'money', T = 'text', I = 'int', D = 'date';
  function col(label, w, t) { return { label: label, w: w, t: t || T, a: (t === M || t === I) ? 'r' : 'l' }; }

  if (type === 'dashboard') {
    etat.kpis = [
      { l: 'Loyers attendus (échéances de la période)', v: totAtt }, { l: 'Loyers encaissés', v: totEnc },
      { l: 'Impayés à ce jour', v: totImp, warn: totImp > 0 }, { l: 'Dépenses', v: totDep },
      { l: 'Solde net (encaissé - dépenses)', v: totEnc - totDep, warn: totEnc - totDep < 0 },
      { l: 'Taux de recouvrement', v: totAtt > 0 ? Math.round(1000 * Math.max(0, totAtt - totImp) / totAtt) / 10 + ' %' : '-' }
    ];
    etat.sections.push({
      titre: 'Situation par cour',
      cols: [col('Cour', 22), col('Propriétaire', 18), col('Maisons', 9, I), col('Attendus', 14, M), col('Encaissés', 14, M), col('Impayés', 14, M), col('Dépenses', 14, M), col('Solde', 14, M)],
      rows: perCour.map(function (p) { return [p.cour.nom, p.owner, p.nbM, p.att, p.enc, p.imp, p.dep, p.enc - p.dep]; }),
      total: ['TOTAL', '', sumBy(perCour, function (p) { return p.nbM; }), totAtt, totEnc, totImp, totDep, totEnc - totDep]
    });
    var parType = {};
    deps.forEach(function (d) { var k = d.r.type || 'Autre'; parType[k] = (parType[k] || 0) + d.montant; });
    var tk = Object.keys(parType).sort(function (a, b) { return parType[b] - parType[a]; });
    if (tk.length) etat.sections.push({ titre: 'Dépenses par type', cols: [col('Type', 30), col('Montant (FCFA)', 20, M)],
      rows: tk.map(function (k) { return [k, parType[k]]; }), total: ['TOTAL', totDep] });
    etat.notes.push('Attendus : loyers dont l\'échéance (le ' + paramEcheanceJour() + ' du mois) tombe dans la période. Encaissés : paiements reçus dans la période. Impayés : reste dû sur ces échéances au ' + fmtDateFR(asOf) + '.');
  } else if (type === 'balance') {
    etat.kpis = [{ l: 'Total recettes', v: totEnc }, { l: 'Total dépenses', v: totDep }, { l: 'Solde net', v: totEnc - totDep, warn: totEnc - totDep < 0 }];
    etat.sections.push({
      titre: 'Balance par cour',
      cols: [col('Cour', 26), col('Propriétaire', 22), col('Recettes (loyers)', 16, M), col('Dépenses', 16, M), col('Solde', 16, M)],
      rows: perCour.map(function (p) { return [p.cour.nom, p.owner, p.enc, p.dep, p.enc - p.dep]; }),
      total: ['TOTAL', '', totEnc, totDep, totEnc - totDep]
    });
    var owners = {};
    perCour.forEach(function (p) { var o = owners[p.owner] || (owners[p.owner] = { enc: 0, dep: 0 }); o.enc += p.enc; o.dep += p.dep; });
    var ok = Object.keys(owners);
    if (ok.length > 1) etat.sections.push({ titre: 'Balance par propriétaire', cols: [col('Propriétaire', 30), col('Recettes', 16, M), col('Dépenses', 16, M), col('Solde', 16, M)],
      rows: ok.map(function (k) { return [k, owners[k].enc, owners[k].dep, owners[k].enc - owners[k].dep]; }), total: ['TOTAL', totEnc, totDep, totEnc - totDep] });
    var pt = {};
    deps.forEach(function (d) { var k = d.r.type || 'Autre'; pt[k] = (pt[k] || 0) + d.montant; });
    var pk = Object.keys(pt).sort(function (a, b) { return pt[b] - pt[a]; });
    if (pk.length) etat.sections.push({ titre: 'Dépenses par type', cols: [col('Type', 30), col('Montant (FCFA)', 20, M)],
      rows: pk.map(function (k) { return [k, pt[k]]; }), total: ['TOTAL', totDep] });
    etat.notes.push('Recettes = loyers effectivement encaissés (date de paiement) ; dépenses = date de la dépense.');
  } else if (type === 'encaisses') {
    etat.orientation = 'landscape';
    etat.kpis = [{ l: 'Loyers encaissés', v: totEnc }, { l: 'Nombre de paiements', v: encaisses.length, n: true }];
    encaisses.sort(function (a, b) { return a.date.localeCompare(b.date); });
    etat.sections.push({
      titre: 'Paiements reçus',
      cols: [col('Date', 12, D), col('Cour', 18), col('Maison', 10), col('Locataire', 20), col('Mois concerné', 16), col('Mode', 12), col('N° quittance', 18), col('Montant', 14, M)],
      rows: encaisses.map(function (e) { return [e.date, e.cour, e.maison, e.loc, capFirst(monthLabel(e.p.periode)), e.p.mode || '', e.p.numeroQuittance || '', e.montant]; }),
      total: ['TOTAL', '', '', '', '', '', '', totEnc]
    });
    var pm = {};
    encaisses.forEach(function (e) { var k = e.p.mode || 'Non précisé'; pm[k] = (pm[k] || 0) + e.montant; });
    var mk = Object.keys(pm);
    if (mk.length) etat.sections.push({ titre: 'Par mode de paiement', cols: [col('Mode', 30), col('Montant', 20, M)], rows: mk.map(function (k) { return [k, pm[k]]; }), total: ['TOTAL', totEnc] });
  } else if (type === 'retards') {
    etat.orientation = 'landscape';
    var maxJ = retards.reduce(function (s, r) { return Math.max(s, r.x.jours); }, 0);
    etat.kpis = [{ l: 'Total des mensualités en retard', v: totImp, warn: totImp > 0 }, { l: 'Mensualités concernées', v: retards.length, n: true }, { l: 'Retard maximal (jours)', v: maxJ, n: true }];
    retards.sort(function (a, b) { return b.x.jours - a.x.jours; });
    etat.sections.push({
      titre: 'Situation au ' + fmtDateFR(asOf) + ' des échéances du ' + fmtDateFR(from) + ' au ' + fmtDateFR(to),
      cols: [col('Cour', 18), col('Maison', 10), col('Locataire', 20), col('Mois', 16), col('Échéance', 13, D), col('Loyer dû', 14, M), col('Déjà payé', 14, M), col('Reste dû', 14, M), col('Retard (j)', 11, I)],
      rows: retards.map(function (r) { return [r.cour, r.maison, r.loc, capFirst(monthLabel(r.x.periode)), r.x.echeance, r.x.du, r.x.paye, r.x.reste, r.x.jours]; }),
      total: ['TOTAL', '', '', '', '', sumBy(retards, function (r) { return r.x.du; }), sumBy(retards, function (r) { return r.x.paye; }), totImp, '']
    });
    var byLoc = {};
    retards.forEach(function (r) { var k = r.cour + ' / ' + r.maison + ' - ' + r.loc; var o = byLoc[k] || (byLoc[k] = { n: 0, t: 0 }); o.n++; o.t += r.x.reste; });
    var lk = Object.keys(byLoc).sort(function (a, b) { return byLoc[b].t - byLoc[a].t; });
    if (lk.length) etat.sections.push({ titre: 'Récapitulatif par locataire', cols: [col('Locataire', 40), col('Mois impayés', 12, I), col('Total dû', 16, M)],
      rows: lk.map(function (k) { return [k, byLoc[k].n, byLoc[k].t]; }), total: ['TOTAL', retards.length, totImp] });
    etat.notes.push('Loyer payable au plus tard le ' + paramEcheanceJour() + ' de chaque mois. ' + ((state.parametres && state.parametres.compterNonEnregistres === false) ? '' : 'Les mois sans paiement enregistré sont comptés impayés (maisons occupées).'));
  } else {
    etat.orientation = 'landscape';
    etat.kpis = [{ l: 'Total des dépenses', v: totDep }, { l: 'Nombre de dépenses', v: deps.length, n: true }];
    deps.sort(function (a, b) { return (a.r.date || '').localeCompare(b.r.date || ''); });
    etat.sections.push({
      titre: 'Dépenses de la période',
      cols: [col('Date', 12, D), col('Cour', 16), col('Maison', 10), col('Type', 14), col('Description', 30), col('Bénéficiaire', 18), col('Statut', 10), col('Montant', 14, M)],
      rows: deps.map(function (d) { return [d.r.date, d.cour, d.maison, d.r.type || 'Autre', d.r.description || '', d.r.prestataire || '', d.r.statut || '', d.montant]; }),
      total: ['TOTAL', '', '', '', '', '', '', totDep]
    });
  }
  return etat;
}
function etatCell(col, v) {
  if (v == null || v === '') return '';
  if (col.t === 'money') return fmtNum(v);
  if (col.t === 'date') return fmtDateFR(v);
  return String(v);
}
function etatKpiText(k) { return typeof k.v === 'number' ? (k.n ? String(k.v) : fmtNum(k.v) + ' FCFA') : String(k.v); }

/* ===================== ÉTATS : PDF ===================== */
function buildEtatPdf(e) {
  if (!window.jspdf || !window.jspdf.jsPDF) return null;
  var land = e.orientation === 'landscape';
  var doc = new window.jspdf.jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4' });
  var PW = land ? 297 : 210, PH = land ? 210 : 297, ML = 14, W = PW - 2 * ML, y;
  function header(first) {
    y = 16;
    if (first) {
      doc.setTextColor(38, 49, 44); doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
      doc.text(pdfSafe(e.titre), ML, y, { baseline: 'top' });
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(101, 112, 100);
      doc.text(pdfSafe(e.sousTitre), ML, y + 8, { baseline: 'top' });
      doc.setDrawColor(140, 106, 34); doc.setLineWidth(0.6); doc.line(ML, y + 15, ML + W, y + 15);
      y += 22;
    } else {
      doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(101, 112, 100);
      doc.text(pdfSafe(e.titre + ' - ' + e.sousTitre), ML, y, { baseline: 'top' });
      y += 8;
    }
    doc.setTextColor(38, 49, 44);
  }
  function ensure(h) { if (y + h > PH - 16) { doc.addPage(); header(false); return true; } return false; }
  header(true);
  // KPI
  if (e.kpis.length) {
    var per = land ? 4 : 3, gap = 4, bw = (W - gap * (per - 1)) / per, bh = 16;
    e.kpis.forEach(function (k, i) {
      if (i % per === 0 && i > 0) y += bh + gap;
      if (i % per === 0) ensure(bh + 2);
      var x = ML + (i % per) * (bw + gap);
      doc.setFillColor(241, 233, 206); doc.setDrawColor(215, 207, 174); doc.setLineWidth(0.2); doc.rect(x, y, bw, bh, 'FD');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(101, 112, 100);
      doc.text(doc.splitTextToSize(pdfSafe(k.l), bw - 4).slice(0, 2), x + 2, y + 2, { baseline: 'top' });
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(k.warn ? 170 : 38, k.warn ? 70 : 49, k.warn ? 54 : 44);
      doc.text(pdfSafe(etatKpiText(k)), x + 2, y + 10, { baseline: 'top' });
    });
    y += bh + 8; doc.setTextColor(38, 49, 44);
  }
  e.sections.forEach(function (s) {
    ensure(30);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(38, 49, 44);
    var tl = doc.splitTextToSize(pdfSafe(s.titre), W);
    doc.text(tl, ML, y, { baseline: 'top' }); y += tl.length * 5 + 2;
    var tw = s.cols.reduce(function (a, c) { return a + c.w; }, 0);
    var cw = s.cols.map(function (c) { return W * c.w / tw; });
    function cx(i) { var x = ML; for (var k = 0; k < i; k++) x += cw[k]; return x; }
    function head() {
      doc.setFillColor(241, 233, 206); doc.rect(ML, y, W, 7, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(38, 49, 44);
      s.cols.forEach(function (c, i) {
        var lines = doc.splitTextToSize(pdfSafe(c.label), cw[i] - 3);
        doc.text(lines[0], c.a === 'r' ? cx(i) + cw[i] - 1.5 : cx(i) + 1.5, y + 1.8, { align: c.a === 'r' ? 'right' : 'left', baseline: 'top' });
      });
      y += 7;
    }
    function drawRow(vals, bold, rule) {
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(8.5);
      var cells = s.cols.map(function (c, i) { return doc.splitTextToSize(pdfSafe(etatCell(c, vals[i])), cw[i] - 3); });
      var n = cells.reduce(function (m, l) { return Math.max(m, l.length); }, 1);
      var rh = n * 3.9 + 2.6;
      if (ensure(rh + 8)) head();
      doc.setTextColor(38, 49, 44);
      s.cols.forEach(function (c, i) {
        doc.text(cells[i], c.a === 'r' ? cx(i) + cw[i] - 1.5 : cx(i) + 1.5, y + 1.5, { align: c.a === 'r' ? 'right' : 'left', baseline: 'top' });
      });
      y += rh;
      if (rule) { doc.setDrawColor(215, 207, 174); doc.setLineWidth(0.2); doc.line(ML, y, ML + W, y); }
    }
    head();
    if (!s.rows.length) { doc.setFont('helvetica', 'italic'); doc.setFontSize(9); doc.setTextColor(101, 112, 100); doc.text('Aucune donnée sur la période.', ML + 1.5, y + 2, { baseline: 'top' }); y += 8; }
    s.rows.forEach(function (r) { drawRow(r, false, true); });
    if (s.total && s.rows.length) {
      doc.setDrawColor(140, 106, 34); doc.setLineWidth(0.5); doc.line(ML, y, ML + W, y);
      drawRow(s.total, true, false);
    }
    y += 8;
  });
  if (e.notes.length) {
    doc.setFont('helvetica', 'italic'); doc.setFontSize(8.5); doc.setTextColor(101, 112, 100);
    e.notes.forEach(function (n) {
      var ls = doc.splitTextToSize(pdfSafe(n), W); ensure(ls.length * 4 + 2);
      doc.text(ls, ML, y, { baseline: 'top' }); y += ls.length * 4 + 2;
    });
  }
  var np = doc.getNumberOfPages();
  for (var p = 1; p <= np; p++) {
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(139, 147, 137);
    doc.text('Registre Immobilier - édité le ' + fmtDateFR(todayISO()), ML, PH - 9, { baseline: 'top' });
    doc.text('Page ' + p + ' / ' + np, PW - ML, PH - 9, { align: 'right', baseline: 'top' });
  }
  return doc;
}

/* ===================== ÉTATS : EXCEL ===================== */
function buildEtatXlsx(e) {
  var aoa = [[e.titre], [e.sousTitre], []];
  e.kpis.forEach(function (k) { aoa.push([k.l, k.v]); });
  if (e.kpis.length) aoa.push([]);
  e.sections.forEach(function (s) {
    aoa.push([s.titre]);
    aoa.push(s.cols.map(function (c) { return c.label; }));
    s.rows.forEach(function (r) { aoa.push(r.map(function (v, i) { return s.cols[i].t === 'date' ? fmtDateFR(v) : v; })); });
    if (s.total && s.rows.length) aoa.push(s.total);
    aoa.push([]);
  });
  e.notes.forEach(function (n) { aoa.push([n]); });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  var maxCols = e.sections.reduce(function (m, s) { return Math.max(m, s.cols.length); }, 2);
  ws['!cols'] = [];
  for (var i = 0; i < maxCols; i++) ws['!cols'].push({ wch: i === 0 ? 34 : 18 });
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'État');
  return wb;
}

/* ===================== ÉTATS : ACTIONS ===================== */
function etatFilename(ext) {
  var c = etatCfg();
  return 'Etat_' + c.type + '_' + c.from + '_au_' + c.to + '.' + ext;
}
async function downloadEtatPdf() {
  var c = etatCfg();
  var doc = buildEtatPdf(computeEtat(c.type, c.from, c.to));
  if (!doc) { alert('Le générateur PDF n\'a pas pu se charger. Vérifiez la connexion internet puis réessayez.'); return; }
  await saveBlob(etatFilename('pdf'), doc.output('blob'));
}
async function downloadEtatXlsx() {
  if (typeof XLSX === 'undefined') { alert('La bibliothèque Excel n\'a pas pu se charger. Vérifiez la connexion.'); return; }
  var c = etatCfg();
  var wb = buildEtatXlsx(computeEtat(c.type, c.from, c.to));
  var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  await saveBlob(etatFilename('xlsx'), new Blob([out], { type: 'application/octet-stream' }));
}

/* ===================== ÉTATS : RENDU ===================== */

    '<button class="btn btn-sm btn-ghost" onclick="setEtatPreset(\'trimestre\')">Trimestre en cours</button>' +

    '<button class="btn btn-sm btn-ghost" onclick="setEtatPreset(\'anneeprec\')">Année précédente</button></div>' +
    '<div class="form-actions" style="flex-wrap:wrap;"><button class="btn btn-primary" onclick="downloadEtatPdf()">Télécharger en PDF</button>' +
    '<button class="btn" onclick="downloadEtatXlsx()">Exporter en Excel</button></div></div>';
  var e = computeEtat(c.type, c.from, c.to);
  html += '<div class="section-head" style="margin-top:22px;"><h3>' + esc(e.titre) + '</h3><span class="maison-sub">' + esc(e.sousTitre) + '</span></div>';
  if (e.kpis.length) {
    html += '<div class="kpis">' + e.kpis.map(function (k) { return kpi(esc(etatKpiText(k)), esc(k.l), k.warn); }).join('') + '</div>';
  }
  e.sections.forEach(function (s) {
    html += '<div class="subblock"><div class="subblock-head"><h4>' + esc(s.titre) + '</h4></div>';

    html += '<div class="table-wrap"><table><tr>' + s.cols.map(function (cl) { return '<th' + (cl.a === 'r' ? ' class="num"' : '') + '>' + esc(cl.label) + '</th>'; }).join('') + '</tr>';
    s.rows.forEach(function (r) {
      html += '<tr>' + s.cols.map(function (cl, i) { return '<td' + (cl.a === 'r' ? ' class="num"' : '') + '>' + esc(etatCell(cl, r[i])) + '</td>'; }).join('') + '</tr>';

    html += '</table></div></div>';
  });
  e.notes.forEach(function (n) { html += '<p style="color:var(--ink-faint);font-size:12px;margin-top:12px;">' + esc(n) + '</p>'; });
  return html;
}

/* ===================== RENDU : TOPBAR ===================== */
function renderTopbar() {

        '</div>';

/* ===================== RENDU : FILTRES DE PÉRIODE ===================== */
function periodTypeSelect() {
  var opts = [['mois', 'Mois'], ['trimestre', 'Trimestre'], ['semestre', 'Semestre'], ['annee', 'Année']]
    .map(function (o) { return '<option value="' + o[0] + '"' + (ui.periodType === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
  return '<div class="field"><label>Type de période</label><select onchange="setPeriodType(this.value)">' + opts + '</select></div>';
}
function periodYearSelect() {
  var current = new Date().getFullYear();
  var years = [];
  for (var y = current - 3; y <= current + 1; y++) years.push(y);
  var opts = years.map(function (y) { return '<option value="' + y + '"' + (ui.periodYear === y ? ' selected' : '') + '>' + y + '</option>'; }).join('');
  return '<div class="field"><label>Année</label><select onchange="setPeriodYear(this.value)">' + opts + '</select></div>';
}
function periodSubSelect() {
  if (ui.periodType === 'mois') {
    var moisNoms = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];
    var opts = moisNoms.map(function (nm, i) { return '<option value="' + (i + 1) + '"' + (ui.periodMonth === i + 1 ? ' selected' : '') + '>' + nm + '</option>'; }).join('');
    return '<div class="field"><label>Mois</label><select onchange="setPeriodMonth(this.value)">' + opts + '</select></div>';
  }
  if (ui.periodType === 'trimestre') {
    var labels = ['T1 (Jan&ndash;Mars)', 'T2 (Avr&ndash;Juin)', 'T3 (Juil&ndash;Sept)', 'T4 (Oct&ndash;Déc)'];
    var opts2 = labels.map(function (lb, i) { return '<option value="' + (i + 1) + '"' + (ui.periodQuarter === i + 1 ? ' selected' : '') + '>' + lb + '</option>'; }).join('');
    return '<div class="field"><label>Trimestre</label><select onchange="setPeriodQuarter(this.value)">' + opts2 + '</select></div>';
  }
  if (ui.periodType === 'semestre') {
    var labels2 = ['S1 (Jan&ndash;Juin)', 'S2 (Juil&ndash;Déc)'];
    var opts3 = labels2.map(function (lb, i) { return '<option value="' + (i + 1) + '"' + (ui.periodSemester === i + 1 ? ' selected' : '') + '>' + lb + '</option>'; }).join('');
    return '<div class="field"><label>Semestre</label><select onchange="setPeriodSemester(this.value)">' + opts3 + '</select></div>';
  }
  return '<div></div>';
}

/* ===================== RENDU : DASHBOARD ===================== */
function renderDashboard() {
  var t = computeTotals();
  var arrears = computeArrears();
  var totalArrears = arrears.reduce(function (s, r) { return s + r.solde; }, 0);

  var html = '<div class="form-box" style="margin-bottom:18px;"><div class="grid3">' +
    periodTypeSelect() + periodYearSelect() + periodSubSelect() + '</div></div>';

  html += '<div class="section"><div class="section-head"><h2>' + esc(t.periodLabel) + '</h2></div><div class="kpis">' +
    kpi(t.nbCours, 'Cour' + (t.nbCours > 1 ? 's' : '')) +
    kpi(t.nbMaisons, 'Maison' + (t.nbMaisons > 1 ? 's' : '') + ' au total') +
    kpi(fmtMoney(t.du), 'Loyers attendus') +
    kpi(fmtMoney(t.paye), 'Loyers perçus') +
    kpi(fmtMoney(t.impaye), 'Impayés sur la période', t.impaye > 0) +
    kpi(fmtMoney(t.depenses), 'Dépenses sur la période') +
    '</div>';
  var typeKeys = Object.keys(t.depensesParType || {});
  if (typeKeys.length) {
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">' +
      typeKeys.sort(function (a, b) { return t.depensesParType[b] - t.depensesParType[a]; }).map(function (type) {
        return '<span class="badge" style="background:var(--brass-bg);color:var(--brass-strong);">' + esc(type) + ' : ' + fmtMoney(t.depensesParType[type]) + '</span>';
      }).join('') + '</div>';
  }
  html += '</div>';

  var cours = scopedCours();
  if (!cours.length) {
    html += '<div class="empty-hint">Aucune cour pour la sélection actuelle.</div>';
  } else {
    var range = periodRange();
    html += '<div class="section"><div class="section-head"><h2>Situation par cour</h2></div><div class="table-wrap"><table>' +
      '<tr><th>Cour</th><th>Localisation</th><th class="num">Maisons</th><th class="num">Loyers perçus</th><th class="num">Impayés</th><th class="num">Dépenses</th></tr>';
    cours.forEach(function (c) {
      var cd = 0, cp = 0, crep = (c.depensesGenerales || []).filter(function (r) { return r.date >= range.start + '-01' && r.date <= range.end + '-31'; })
        .reduce(function (s, r) { return s + (Number(r.montant) || 0); }, 0);
      c.maisons.forEach(function (m) {
        crep += (m.depenses || []).filter(function (r) { return r.date >= range.start + '-01' && r.date <= range.end + '-31'; })
          .reduce(function (s, r) { return s + (Number(r.montant) || 0); }, 0);
        (m.paiements || []).forEach(function (p) {
          if (p.periode >= range.start && p.periode <= range.end) { cd += Number(p.montantDu) || 0; cp += Number(p.montantPaye) || 0; }
        });
      });
      html += '<tr><td>' + esc(c.nom) + '</td><td>' + esc(c.localisation || '—') + '</td><td class="num">' + c.maisons.length + '</td>' +
        '<td class="num">' + fmtMoney(cp) + '</td><td class="num">' + fmtMoney(Math.max(0, cd - cp)) + '</td><td class="num">' + fmtMoney(crep) + '</td></tr>';
    });
    html += '</table></div></div>';
  }

  html += '<div class="section"><div class="section-head"><h2>Loyers en retard</h2>' +
    '<span><span class="badge badge-red" style="font-size:12.5px;padding:4px 10px;">Total en retard : ' + fmtMoney(totalArrears) + '</span> ' +
    (arrears.length ? '<button class="btn btn-sm btn-primary" onclick="setTab(\'relances\')">Préparer les relances</button>' : '') + '</span></div>';
  if (!arrears.length) {
    html += '<div class="empty-hint">Aucun loyer en retard pour la sélection actuelle.</div></div>';
  } else {
    html += '<div class="table-wrap"><table><tr><th>Cour</th><th>Maison</th><th>Locataire</th><th>Mois</th><th>Échéance</th><th class="num">Dû</th><th class="num">Payé</th><th class="num">Solde</th><th class="num">Jours de retard</th></tr>';
    arrears.forEach(function (r) {
      html += '<tr><td>' + esc(r.cour.nom) + '</td><td>' + esc(r.maison.nom) + '</td><td>' + esc(r.maison.locataireNom || '—') + '</td>' +
        '<td>' + esc(monthLabel(r.p.periode)) + '</td><td>' + esc(r.p.dateEcheance || '—') + '</td>' +
        '<td class="num">' + fmtMoney(r.p.montantDu) + '</td><td class="num">' + fmtMoney(r.p.montantPaye) + '</td>' +
        '<td class="num" style="color:var(--red);font-weight:600;">' + fmtMoney(r.solde) + '</td>' +
        '<td class="num">' + r.jours + '</td></tr>';
    });
    html += '</table></div></div>';
  }
  return html;
}
function kpi(v, l, warn) {
  return '<div class="kpi' + (warn ? ' warn' : '') + '"><div class="v' + (warn ? ' warn' : '') + '">' + v + '</div><div class="l">' + l + '</div></div>';
}

function statusBadge(p) {
  var du = Number(p.montantDu) || 0, paye = Number(p.montantPaye) || 0;
  if (paye >= du && du > 0) return '<span class="badge badge-green">Payé</span>';
  if (paye > 0) return '<span class="badge badge-amber">Partiel</span>';
  return '<span class="badge badge-red">Impayé</span>';
}

/* ---- paiements ---- */
function renderPaiementsBlock(m) {
  var html = '<div class="subblock"><div class="subblock-head"><h4>Paiements de loyer</h4>' +
    (ui.addingPaiementTo === m.id ? '' : '<button class="btn btn-sm" onclick="showAddPaiement(\'' + m.id + '\')">+ Ajouter un paiement</button>') + '</div>';

  if (ui.addingPaiementTo === m.id) {
    html += '<div class="form-box"><div class="grid3">' +
      field('Mois concerné (AAAA-MM) *', 'month', 'f-pay-periode', currentPeriode()) +
      field("Date d'échéance", 'date', 'f-pay-echeance', '') +
      field('Date de paiement', 'date', 'f-pay-date', todayISO()) +
      field('Montant dû (FCFA)', 'number', 'f-pay-du', m.loyer) +
      field('Montant payé (FCFA)', 'number', 'f-pay-paye', m.loyer) +
      selectField('Mode de paiement', 'f-pay-mode', ['Espèces', 'Mobile Money', 'Virement', 'Chèque']) +
      '</div>' + field('Observation', 'text', 'f-pay-note', '') +
      '<div class="form-actions"><button class="btn btn-primary" onclick="submitAddPaiement(\'' + m.id + '\')">Enregistrer</button>' +
      '<button class="btn btn-ghost" onclick="cancelAddPaiement()">Annuler</button></div></div>';
  }

  var rows = (m.paiements || []).slice().sort(function (a, b) { return (b.periode || '').localeCompare(a.periode || ''); });
  if (!rows.length) {
    html += '<div class="empty-hint">Aucun paiement enregistré.</div></div>';
    return html;
  }
  html += '<div class="table-wrap"><table><tr><th>Mois</th><th>Échéance</th><th>Payé le</th><th class="num">Dû</th><th class="num">Payé</th><th>Mode</th><th>Statut</th><th></th></tr>';
  rows.forEach(function (p) {
    html += '<tr><td>' + esc(monthLabel(p.periode)) + '</td><td>' + esc(p.dateEcheance || '—') + '</td><td>' + esc(p.datePaiement || '—') + '</td>' +
      '<td class="num">' + fmtMoney(p.montantDu) + '</td><td class="num">' + fmtMoney(p.montantPaye) + '</td><td>' + esc(p.mode || '—') + '</td><td>' + statusBadge(p) + '</td>' +
      '<td class="row-actions">' +
      (p.montantPaye > 0 ? '<button class="btn btn-sm btn-ghost" onclick="openQuittance(\'' + m.id + '\',\'' + p.id + '\')">Quittance</button>' : '') +
      '<button class="btn btn-sm btn-danger" onclick="deletePaiement(\'' + m.id + '\',\'' + p.id + '\')">&times;</button></td></tr>';
  });
  html += '</table></div></div>';
  return html;
}

/* ---- dépenses : réparations, impôt foncier, taxes, assurance... (générale ou par maison) ---- */
function renderDepensesBlock(scope, ownerId, list, title) {
  var isAdding = ui.addingDepenseTo && ui.addingDepenseTo.scope === scope && ui.addingDepenseTo.id === ownerId;
  var html = '<div class="subblock"><div class="subblock-head"><h4>' + title + '</h4>' +
    (isAdding ? '' : '<button class="btn btn-sm" onclick="showAddDepense(\'' + scope + '\',\'' + ownerId + '\')">+ Ajouter une dépense</button>') + '</div>';

  if (isAdding) {
    html += '<div class="form-box"><div class="grid3">' +
      selectField('Type de dépense *', 'f-dep-type', DEPENSE_TYPES, 'Réparation') +
      field('Date', 'date', 'f-dep-date', todayISO()) +
      field('Montant (FCFA)', 'number', 'f-dep-montant', '') +
      '</div>' +
      fieldTextarea('Description *', 'f-dep-desc', '', 'Ex : Impôt foncier 2026, Réfection de la toiture, Prime assurance habitation') +
      '<div class="grid2">' + selectField('Statut', 'f-dep-statut', ['À prévoir', 'En cours', 'Terminée', 'Payée']) +
      field('Prestataire / Bénéficiaire', 'text', 'f-dep-prestataire', '', 'Ex : Direction Générale des Impôts') + '</div>' +
      '<div class="form-actions"><button class="btn btn-primary" onclick="submitAddDepense(\'' + scope + '\',\'' + ownerId + '\')">Enregistrer</button>' +
      '<button class="btn btn-ghost" onclick="cancelAddDepense()">Annuler</button></div></div>';
  }

  if (!list.length) {
    html += '<div class="empty-hint">Aucune dépense enregistrée.</div></div>';
    return html;
  }
  var sorted = list.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
  html += '<div class="table-wrap"><table><tr><th>Date</th><th>Type</th><th>Description</th><th class="num">Montant</th><th>Prestataire</th><th>Statut</th><th></th></tr>';
  sorted.forEach(function (r) {
    var badgeClass = (r.statut === 'Terminée' || r.statut === 'Payée') ? 'badge-green' : (r.statut === 'En cours' ? 'badge-amber' : 'badge-red');
    html += '<tr><td>' + esc(r.date || '—') + '</td><td>' + esc(r.type || 'Autre') + '</td><td>' + esc(r.description) + '</td><td class="num">' + fmtMoney(r.montant) + '</td>' +
      '<td>' + esc(r.prestataire || '—') + '</td><td><span class="badge ' + badgeClass + '">' + esc(r.statut) + '</span></td>' +
      '<td class="row-actions"><button class="btn btn-sm btn-danger" onclick="deleteDepense(\'' + scope + '\',\'' + ownerId + '\',\'' + r.id + '\')">&times;</button></td></tr>';
  });
  html += '</table></div></div>';
  return html;
}

/* ===================== RENDU : QUITTANCES (liste) ===================== */
function renderQuittancesTab() {
  var rows = [];
  scopedCours().forEach(function (c) {
    c.maisons.forEach(function (m) {
      (m.paiements || []).forEach(function (p) {
        if (Number(p.montantPaye) > 0) rows.push({ cour: c, maison: m, p: p });
      });
    });
  });
  var html = '<div class="section-head"><h2>Quittances</h2></div>';

  html += '<div class="form-box"><h4 style="margin-bottom:10px;">Remplissage rapide</h4>' +
    '<p style="color:var(--ink-soft);font-size:13px;margin:0 0 10px;">Indiquez l\'ID du locataire et le mois concerné : la quittance est retrouvée ou générée automatiquement.</p>' +
    '<div class="grid3">' +
    field('ID Locataire *', 'text', 'f-quick-locid', '', 'Ex : LOC-001') +
    field('Mois de paiement *', 'month', 'f-quick-mois', currentPeriode()) +
    '</div>' +
    (ui.quickFillError ? '<div style="color:var(--red);font-size:13px;margin-top:4px;">' + esc(ui.quickFillError) + '</div>' : '') +
    '<div class="form-actions"><button class="btn btn-primary" onclick="quickFillQuittance()">Remplir la quittance</button></div>' +
    '<p style="color:var(--ink-faint);font-size:12px;margin:10px 0 0;">L\'ID Locataire de chaque maison est visible dans l\'onglet « Cours &amp; maisons ».</p>' +
    '</div>';

  if (!rows.length) {
    html += '<div class="empty-hint" style="margin-top:16px;">Aucun paiement encaissé pour le moment. Les quittances apparaîtront ici dès qu\'un loyer sera enregistré comme payé.</div>';
    return html;
  }
  rows.sort(function (a, b) { return (b.p.periode || '').localeCompare(a.p.periode || ''); });
  html += '<div class="section-head" style="margin-top:24px;"><h3>Historique des quittances</h3></div>';
  html += '<div class="table-wrap"><table><tr><th>N&deg;</th><th>Mois</th><th>Cour</th><th>Maison</th><th>Locataire</th><th class="num">Montant</th><th></th></tr>';
  rows.forEach(function (r) {
    html += '<tr><td>' + esc(r.p.numeroQuittance || '—') + '</td><td>' + esc(monthLabel(r.p.periode)) + '</td>' +
      '<td>' + esc(r.cour.nom) + '</td><td>' + esc(r.maison.nom) + '</td><td>' + esc(r.maison.locataireNom || '—') + '</td>' +
      '<td class="num">' + fmtMoney(r.p.montantPaye) + '</td>' +
      '<td class="row-actions"><button class="btn btn-sm" onclick="openQuittance(\'' + r.maison.id + '\',\'' + r.p.id + '\')">Voir / imprimer</button></td></tr>';
  });
  html += '</table></div>';
  return html;
}

/* ===================== RENDU : MODALE QUITTANCE ===================== */
function renderQuittanceModal() {
  if (!ui.printing) return '';
  var found = findMaison(ui.printing.maisonId);
  if (!found) return '';
  var p = found.maison.paiements.find(function (x) { return x.id === ui.printing.payId; });
  if (!p) return '';
  var m = found.maison, c = found.cour;
  var owner = findProprietaire(c.proprietaireId) || { nom: '', telephone: '' };
  var montantMots = numberToFrenchWords(p.montantPaye) + ' francs CFA';
  return '' +
    '<div class="overlay print-target" onclick="if(event.target===this)closeQuittance()">' +
      '<div class="modal">' +
        '<div class="modal-head no-print"><strong>Quittance ' + esc(p.numeroQuittance || '') + '</strong>' +
          '<button class="btn btn-sm btn-ghost" onclick="closeQuittance()">Fermer &times;</button></div>' +
        '<div class="modal-body">' +
          '<div class="receipt">' +
            '<h2>Quittance de loyer</h2>' +
            '<div class="rnum">N&deg; ' + esc(p.numeroQuittance || '') + '</div>' +
            '<table>' +
              recRow('Bailleur', owner.nom || '—') +
              recRow('Téléphone bailleur', owner.telephone || '—') +
              recRow('Cour', c.nom) +
              recRow('Maison', m.nom + (m.adresse ? ' — ' + m.adresse : '')) +
              recRow('Locataire', m.locataireNom || '—') +
              recRow('Période concernée', monthLabel(p.periode)) +
              recRow('Mode de paiement', p.mode || '—') +
              recRow('Date de paiement', p.datePaiement || '—') +
            '</table>' +
            '<div class="amount-box"><div>Montant reçu</div><div class="big num">' + fmtMoney(p.montantPaye) + '</div>' +
              '<div style="font-size:12.5px;color:#657064;margin-top:4px;">Arrêtée la présente quittance à la somme de : ' + montantMots + '.</div></div>' +
            '<div class="sigs"><div>Signature du bailleur</div><div>Signature du locataire</div></div>' +
          '</div>' +
          '<div class="form-actions no-print"><button class="btn btn-primary" onclick="doPrint()">Imprimer / Enregistrer en PDF</button>' +
          '<button class="btn btn-ghost" onclick="closeQuittance()">Fermer</button></div>' +
        '</div>' +
      '</div>' +
    '</div>';
}
function recRow(label, value) { return '<tr><td class="rl">' + esc(label) + '</td><td>' + esc(value) + '</td></tr>'; }

/* ===================== PETITS HELPERS DE FORMULAIRE ===================== */
function field(label, type, id, value, placeholder) {
  return '<div class="field"><label>' + label + '</label><input type="' + type + '" id="' + id + '" value="' + esc(value == null ? '' : value) + '"' +
    (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '></div>';
}
function fieldTextarea(label, id, value, placeholder) {
  return '<div class="field"><label>' + label + '</label><textarea id="' + id + '"' + (placeholder ? ' placeholder="' + esc(placeholder) + '"' : '') + '>' + esc(value || '') + '</textarea></div>';
}
function selectField(label, id, options, current) {
  var opts = options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === current ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
  return '<div class="field"><label>' + label + '</label><select id="' + id + '"><option value="">—</option>' + opts + '</select></div>';
}
function infoLine(label, value) {
  return '<div><div style="font-size:11.5px;color:var(--ink-soft);">' + esc(label) + '</div><div style="font-size:13.5px;">' + esc(value) + '</div></div>';
}

/* ===================== RENDU PRINCIPAL ===================== */
function render() {
  var flag = ui.savedFlag;
  ui.savedFlag = '';
  var content = '';
  if (ui.tab === 'dashboard') content = renderDashboard();
  else if (ui.tab === 'proprietaires') content = renderProprietaires();
  else if (ui.tab === 'registre') content = renderRegistre();
  else if (ui.tab === 'relances') content = renderRelances();
  else if (ui.tab === 'etats') content = renderEtats();
  else content = renderQuittancesTab();

  var html = renderTopbar() + '<div class="section">' + content + '</div>';
  if (flag) html += '<div class="save-flag no-print">' + esc(flag) + '</div>';
  html += '<footer class="hint no-print">Registre Immobilier &middot; ' +
    (IN_CLAUDE ? 'données propres à cet artefact' : 'données enregistrées localement dans ce navigateur') + '</footer>';
  html += renderQuittanceModal();
  html += renderRelanceModal();

  document.getElementById('app').innerHTML = html;
  if (ui.printing) document.body.classList.add('print-mode');
  else document.body.classList.remove('print-mode');
}

/* ===================== DÉMARRAGE ===================== */
render();
</script></body></html>
